name: Rotapfel quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: JavaScript syntax (ES modules)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find custom_components/rotapfel_dashboard_manager -name '*.js' -print0)
      - name: Python syntax and version consistency
        run: python scripts/check_quality.py
